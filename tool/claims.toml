# claim-check settings. These override the defaults baked into verify.py.
# Every value is optional. Delete a line to fall back to the default.

[settings]

# Treat an unverifiable pass claim as a block instead of a warning.
# Keep this false. Precision first. A false block is worse than a missed claim.
strict_unverified = false

# Cap how many evidence lines a single result prints.
max_evidence = 8

# Direct command argv prefixes. Shell pipelines/chains and dry runs are
# unverified. "make" alone is intentionally not a verification command.
test_command_patterns = [
  "pytest", "unittest", "npm test", "npm run test", "go test", "cargo test",
  "jest", "vitest run", "make test", "make check",
]
build_command_patterns = ["npm run build", "cargo build", "go build", "make build"]

# Symbols too generic to verify with git grep. These return a warning, not a block.
stopwords = [
  "config",
  "data",
  "value",
  "result",
  "test",
  "file",
  "path",
  "name",
  "type",
  "error",
  "main",
  "index",
]
